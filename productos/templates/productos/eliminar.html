<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar producto</title>
</head>

<body>

    <h1>Eliminar producto</h1>

    <p>
        ¿Está seguro de que desea eliminar
        <strong>{{ producto.nombre }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

        <a href="{% url 'lista_productos' %}">
            Cancelar
        </a>

    </form>

</body>
</html>
